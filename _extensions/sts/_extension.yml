title: Sea Through Science
author: Adam N. H. Smith
version: 0.5.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    revealjs:
      theme: [default, embedded.scss, sts.scss]
      logo: lockup-horiz.svg
      footer-logo-link: "https://www.seathrough.science/"
      transition: fade
      background-transition: fade
      smaller: true
      filters:
        - reveal-header.lua
        - sections.lua
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      citeproc: true
      csl: elsevier-vancouver.csl
